# Local development only. These credentials must not be used in AWS.
x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://stockpilot:local-dev-only@db:5432/stockpilot

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: stockpilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    ports:
      - "127.0.0.1:${STOCKPILOT_WEB_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://stockpilot:local-dev-only@db:5432/stockpilot
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
